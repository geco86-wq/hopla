<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hopla – gry ruchowe</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--sky1:#1b1f5e;--sky2:#3a2a86;--sun:#ffd23f;--grass:#3ccf7a;--pink:#ff5fa2}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--sky1);color:#fff;font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;cursor:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 30%,var(--sky2),var(--sky1));z-index:5;text-align:center;padding:16px}
h1{font-size:clamp(40px,7vw,100px);margin:0;line-height:1;color:var(--sun);text-shadow:0 6px 0 #c48a00}
p{margin:0;font-size:clamp(17px,2.2vw,28px);opacity:.9}
#qr{background:#fff;padding:18px;border-radius:24px}
#code{font-size:clamp(36px,5vw,70px);font-weight:800;letter-spacing:.2em;color:var(--sun)}
button{font:800 22px "Baloo 2",sans-serif;border:0;border-radius:22px;cursor:pointer;color:#1b1f5e;box-shadow:0 7px 0 rgba(0,0,0,.3)}
button:focus-visible{outline:6px solid #fff;transform:scale(1.06)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;width:min(1300px,94vw)}
.card{display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:2px;line-height:1.05;transition:transform .12s}
.card b{font-size:clamp(34px,4vw,60px)}.card span{font-size:clamp(16px,1.6vw,24px)}.card small{font:600 clamp(12px,1.1vw,16px) "Baloo 2";opacity:.75}
.hint{font-size:16px;opacity:.75;max-width:460px}
#phone{justify-content:flex-start;gap:12px;overflow:auto;padding-top:14px}
#cam{position:relative;width:min(92vw,46vh);aspect-ratio:1;border-radius:24px;overflow:hidden;border:5px solid var(--sun);background:#000;touch-action:none;flex:none}
#cam canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;transform:scaleX(-1)}
.row{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:800;flex-wrap:wrap;justify-content:center}
.sm{font-size:24px;padding:4px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.3);background:#fff}
#pgrid{grid-template-columns:repeat(2,minmax(0,1fr));width:min(460px,94vw);gap:10px}
#pgrid .card{flex-direction:row;gap:8px;padding:10px;justify-content:flex-start}
#pgrid .card b{font-size:30px}#pgrid .card span{font-size:19px}#pgrid .card small{display:none}
#fps{font-size:13px;opacity:.6}
</style></head><body>
<video id="v" playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<div id="tv" hidden>
  <canvas id="c"></canvas>
  <div class="screen" id="pair">
    <h1>Hopla!</h1>
    <p>Zeskanuj kod aparatem w telefonie</p>
    <div id="qr"></div>
    <p>Kod pokoju: <span id="code"></span></p>
  </div>
  <div class="screen" id="menu" hidden>
    <h1>Hopla!</h1>
    <p>Wybierz grę na telefonie albo pilotem</p>
    <div class="grid" id="grid"></div>
    <p class="hint" id="snd">🔇 Naciśnij OK na pilocie, żeby włączyć dźwięk</p>
  </div>
</div>
<div id="phone" class="screen" hidden>
  <p id="pst">Łączę z telewizorem…</p>
  <div id="cam"><canvas id="sk"></canvas></div>
  <div class="row"><button class="sm" id="zo" aria-label="Oddal">−</button><span id="zv">1.0×</span><button class="sm" id="zi" aria-label="Przybliż">+</button><button class="sm" id="zr" aria-label="Wyśrodkuj">⟲</button><button class="sm" id="flip" aria-label="Zmień kamerę">↻</button><button class="sm" id="stop">⏹ Menu</button></div>
  <p class="hint">Przesuń obraz palcem, przybliż dwoma palcami. Całe dziecko musi być w kwadracie. <span id="fps"></span></p>
  <div class="grid" id="pgrid"></div>
</div>
<script>
const Q=new URLSearchParams(location.search),room=Q.get('room');
const META=[['⭐','Gwiazdki','łap rękami','#ffd23f'],['🪵','Skoki','skacz i kucaj','#3ccf7a'],['🚗','Rajd','trzymaj kierownicę','#7ad3ff'],['🌲','Las','maszeruj w miejscu','#9be36b'],['🛷','Sanie','wychylaj się i skacz','#e3f2ff'],['🏊','Pływanie','machaj rękami','#5fd0ff'],['🧜','Syrenka','płyń między rafami','#ff9ed8'],['🚂','Pociąg','kręć rękami','#ffb15c'],['✈️','Samolot','ręce jak skrzydła','#b9a7ff'],['🐶','Spacer','maszeruj z pieskiem','#ffd08a'],['🏁','Rajd Pro','kierownica i drift','#ff9f6b']];
function buildGrid(el,click){META.forEach((m,i)=>{const b=document.createElement('button');b.className='card';b.style.background=m[3];b.dataset.g=i;b.innerHTML='<b>'+m[0]+'</b><span>'+m[1]+'</span><small>'+m[2]+'</small>';b.onclick=()=>click(i);el.appendChild(b)})}
</script>
<script type="module">
const $=id=>document.getElementById(id);
// 15 punktów: 0 nos,1 lB,2 pB,3 lŁ,4 pŁ,5 lD,6 pD,7 lBio,8 pBio,9 lK,10 pK,11 lKo,12 pKo,13 lSt,14 pSt
const K=[0,11,12,13,14,15,16,23,24,25,26,27,28,31,32];
const BONES=[[1,2],[1,3],[3,5],[2,4],[4,6],[1,7],[2,8],[7,8],[7,9],[9,11],[8,10],[10,12],[11,13],[12,14]];

/* ======================= TELEFON ======================= */
if(room){
  $('phone').hidden=false;
  const v=$('v'),sk=$('sk'),sx=sk.getContext('2d');
  const det=document.createElement('canvas');det.width=det.height=256;const dx=det.getContext('2d',{willReadFrequently:false});
  let ctl=null,pc=null,facing='user',stream=null,z=1,cx=.5,cy=.5,seq=0;
  try{const s=JSON.parse(localStorage.getItem('hoplaCam'));if(s){z=s.z;cx=s.cx;cy=s.cy}}catch(e){}
  const save=()=>{$('zv').textContent=z.toFixed(1)+'×';try{localStorage.setItem('hoplaCam',JSON.stringify({z,cx,cy}))}catch(e){}};save();
  $('zi').onclick=()=>{z=Math.min(4,z*1.2);save()};$('zo').onclick=()=>{z=Math.max(1,z/1.2);save()};$('zr').onclick=()=>{z=1;cx=.5;cy=.5;save()};
  const ptr=new Map();let pinch=null;
  sk.onpointerdown=e=>{sk.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z}}};
  sk.onpointerup=sk.onpointercancel=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;save()};
  sk.onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o||!v.videoWidth)return;
    if(pinch&&ptr.size===2){o.x=e.clientX;o.y=e.clientY;const[a,b]=[...ptr.values()];z=Math.max(1,Math.min(4,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));$('zv').textContent=z.toFixed(1)+'×';return}
    const S=sk.clientWidth,s=Math.min(v.videoWidth,v.videoHeight)/z;
    cx+=(e.clientX-o.x)/S*s/v.videoWidth;cy-=(e.clientY-o.y)/S*s/v.videoHeight;o.x=e.clientX;o.y=e.clientY};
  const send=m=>{try{ctl&&ctl.open&&ctl.send(m)}catch(e){}};
  buildGrid($('pgrid'),i=>send({t:'start',g:i}));$('stop').onclick=()=>send({t:'menu'});
  function connect(){const peer=new Peer();
    peer.on('open',()=>{
      ctl=peer.connect('hopla-'+room,{label:'ctl',reliable:true});
      pc=peer.connect('hopla-'+room,{label:'pose',reliable:false,serialization:'raw'});
      ctl.on('open',()=>{$('pst').textContent='✅ Połączono z telewizorem';navigator.vibrate&&navigator.vibrate(80)});
      ctl.on('data',d=>{if(d.t==='ping')send({t:'pong',id:d.id});if(d.t==='lat')$('fps').textContent=$('fps').textContent.split(' ·')[0]+' · opóźnienie '+d.ms+' ms (kompensowane)'});
      ctl.on('close',()=>{$('pst').textContent='Rozłączono, łączę ponownie…';setTimeout(()=>{peer.destroy();connect()},1500)})});
    peer.on('error',e=>{$('pst').textContent=e.type==='peer-unavailable'?'Nie znalazłem telewizora — zeskanuj nowy kod':'Błąd połączenia: '+e.type})}
  connect();
  async function cam(){stream&&stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:480},height:{ideal:360},frameRate:{ideal:30}}});
    v.srcObject=stream;await v.play()}
  $('flip').onclick=()=>{facing=facing==='user'?'environment':'user';cam()};
  try{await cam()}catch(e){$('pst').textContent='Brak dostępu do kamery: '+e.message}
  $('pst').textContent+=' · ładuję wykrywanie ruchu…';
  const {PoseLandmarker,FilesetResolver}=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const pose=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1,minPoseDetectionConfidence:.4,minTrackingConfidence:.4});
  $('pst').textContent=$('pst').textContent.replace(' · ładuję wykrywanie ruchu…','');
  const buf=new ArrayBuffer(4+K.length*5),dv=new DataView(buf);let tCap=0;
  let fr=0,fT=performance.now(),lastTs=0;
  function frame(){
    if(v.readyState<2||!v.videoWidth)return;
    const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(vw,vh)/z;
    const X0=Math.min(vw-s,Math.max(0,cx*vw-s/2)),Y0=Math.min(vh-s,Math.max(0,cy*vh-s/2));cx=(X0+s/2)/vw;cy=(Y0+s/2)/vh;
    dx.drawImage(v,X0,Y0,s,s,0,0,256,256);
    let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;
    const lm=pose.detectForVideo(det,ts).landmarks?.[0];
    const S=sk.clientWidth|0;if(sk.width!==S){sk.width=S;sk.height=S}
    sx.drawImage(v,X0,Y0,s,s,0,0,S,S);
    dv.setUint16(0,seq++&65535);dv.setUint16(2+K.length*5,Math.min(999,Math.round(performance.now()-tCap+17)));
    if(lm){K.forEach((k,i)=>{const p=lm[k],o=2+i*5;dv.setUint16(o,Math.max(0,Math.min(65535,(1-p.x+.5)/2*65535)));dv.setUint16(o+2,Math.max(0,Math.min(65535,(p.y+.5)/2*65535)));dv.setUint8(o+4,Math.max(0,Math.min(255,(p.visibility||0)*255)))});
      sx.lineCap='round';sx.lineWidth=S/70;sx.strokeStyle='#ff5fa2';
      for(const[a,b]of BONES){const A=lm[K[a]],B=lm[K[b]];if(A.visibility<.4||B.visibility<.4)continue;sx.beginPath();sx.moveTo(A.x*S,A.y*S);sx.lineTo(B.x*S,B.y*S);sx.stroke()}
      K.forEach((k,i)=>{const p=lm[k];if(p.visibility<.4)return;const h=i===5||i===6;sx.fillStyle=h?'#ffd23f':'#fff';sx.beginPath();sx.arc(p.x*S,p.y*S,h?S/36:S/100,0,7);sx.fill()});
    }else{for(let i=0;i<K.length;i++)dv.setUint8(2+i*5+4,0)}
    try{pc&&pc.open&&pc.send(buf.slice(0))}catch(e){}
    fr++;const n=performance.now();if(n-fT>1000){$('fps').textContent=fr+' kl/s'+($('fps').textContent.includes(' ·')?' ·'+$('fps').textContent.split(' ·')[1]:'');fr=0;fT=n}
  }
  if('requestVideoFrameCallback' in HTMLVideoElement.prototype){const f=(n,m)=>{const c=m&&m.captureTime;tCap=c&&n-c<300&&n-c>0?c:n;frame();v.requestVideoFrameCallback(f)};v.requestVideoFrameCallback(f)}
  else (function f(){requestAnimationFrame(f);frame()})();
}

/* ======================= TELEWIZOR ======================= */
else {
  $('tv').hidden=false;
  const demo=Q.has('demo');
  const c=$('c'),x=c.getContext('2d');let W,H,FULL;
  let MAXW=960,PRED=!Q.has('nopred');const fit=()=>{const k=Math.min(1,MAXW/innerWidth);W=c.width=Math.round(innerWidth*k);H=c.height=Math.round(innerHeight*k);FULL={cx:W/2,top:0,h:H,rx:Math.min(W,H*1.45)}};fit();addEventListener('resize',fit);
  if(!x.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(a,b,w,h){this.rect(a,b,w,h)};
  /* ---------- połączenie ---------- */
  let code=String(Math.floor(1000+Math.random()*9000));
  function showMenu(){$('pair').hidden=true;$('menu').hidden=false;const b=document.querySelector('#grid button');b&&b.focus()}
  if(!demo){
    $('code').textContent=code;
    new QRCode($('qr'),{text:location.href.split('?')[0]+'?room='+code,width:250,height:250});
    const peer=new Peer('hopla-'+code);
    peer.on('error',e=>{if(e.type==='unavailable-id')location.reload()});
    peer.on('connection',cn=>{
      if(cn.label==='pose'){cn.on('data',d=>{if(d instanceof ArrayBuffer)ingest(d);else if(d&&d.arrayBuffer)d.arrayBuffer().then(ingest)})}
      else{cn.on('open',()=>{if(!cur)showMenu();clearInterval(pingT);pingT=setInterval(()=>{pingS[++pingN]=performance.now();try{cn.send({t:'ping',id:pingN});cn.send({t:'lat',ms:Math.round(LAT.tot)})}catch(e){}},1000)});
        cn.on('data',d=>{if(d.t==='start')startGame(d.g);if(d.t==='menu')toMenu();if(d.t==='pong'&&pingS[d.id]){const r=performance.now()-pingS[d.id];LAT.rtt=LAT.rtt?LAT.rtt*.7+r*.3:r;delete pingS[d.id]}});
        cn.on('close',()=>{toMenu();$('pair').hidden=false;$('menu').hidden=true})}});
  }else showMenu();
  buildGrid($('grid'),i=>startGame(i));
  addEventListener('keydown',e=>{audioOn();const bs=[...document.querySelectorAll('#grid button')],i=bs.indexOf(document.activeElement);
    if(cur&&(e.key==='Escape'||e.key==='Backspace'||e.key==='GoBack')){toMenu();e.preventDefault();return}
    if(i<0)return;const m={ArrowRight:1,ArrowLeft:-1,ArrowDown:6,ArrowUp:-6}[e.key];if(m){const n=bs[i+m];n&&n.focus();e.preventDefault()}});
  addEventListener('pointerdown',audioOn);
  /* ---------- odbiór i wygładzanie pozy ---------- */
  const SM=[];let lastPk=0,pose=null,pingT=0,pingN=0;const pingS={},LAT={rtt:0,proc:60,tot:80,fps:60};
  function ingest(ab){const d=new DataView(ab),now=performance.now(),dt=Math.max(12,Math.min(120,now-lastPk));lastPk=now;if(ab.byteLength>=4+K.length*5){LAT.proc=LAT.proc*.9+d.getUint16(2+K.length*5)*.1}LAT.tot=LAT.proc+LAT.rtt/2+1000/LAT.fps*1.5;
    for(let i=0;i<K.length;i++){const o=2+i*5,px=d.getUint16(o)/65535*2-.5,py=d.getUint16(o+2)/65535*2-.5,vis=d.getUint8(o+4)/255;let s=SM[i];
      if(!s||s.v<.3){SM[i]={x:px,y:py,vx:0,vy:0,v:vis,dx:px,dy:py};continue}
      s.vx=s.vx*.4+(px-s.x)/dt*.6;s.vy=s.vy*.4+(py-s.y)/dt*.6;s.x=px;s.y=py;s.v=vis}}
  function sample(now){if(now-lastPk>1000||!SM.length){pose=null;return}
    const h=Math.min(220,Math.min(80,now-lastPk)+(PRED?LAT.tot:0));pose=[];
    for(let i=0;i<K.length;i++){const s=SM[i];if(!s){pose.push([0,0,0]);continue}
      const ex=cl(s.vx*h,-.12,.12),ey=cl(s.vy*h,-.12,.12),tx=s.x+ex,ty=s.y+ey,sp=Math.hypot(s.vx,s.vy)*1000,a=Math.min(1,.65+sp*.6);
      s.dx+=(tx-s.dx)*a;s.dy+=(ty-s.dy)*a;pose.push([s.dx,s.dy,s.v])}
    if(pose[1][2]<.2||pose[2][2]<.2)pose=null}
  function demoFeed(t){const j=Math.max(0,Math.sin(t/650))**8*.07,k=Math.sin(t/230)*.05,a=Math.sin(t/900)*.13,u=Math.sin(t/1700)>.6?-.25:0,sq=Math.max(0,Math.sin(t/3100))*.12;
    const P=[[.5,.2+sq],[.42,.33+sq],[.58,.33+sq],[.36,.45+sq],[.64,.45+sq],[.37+a*.3,.55+a+u+sq],[.63+a*.3,.55-a+sq],[.45,.58+sq],[.55,.58+sq],[.45,.74+k],[.55,.74-k],[.45,.9+k],[.55,.9-k],[.42,.93+k],[.58,.93-k]];
    const ab=new ArrayBuffer(2+K.length*5),d=new DataView(ab);P.forEach((p,i)=>{d.setUint16(2+i*5,(p[0]+.5)/2*65535);d.setUint16(4+i*5,(p[1]-j+.5)/2*65535);d.setUint8(6+i*5,250)});ingest(ab)}
  /* ---------- dźwięk ---------- */
  let AC=null,mus=null;
  function audioOn(){try{AC=AC||new AudioContext();AC.resume();$('snd').hidden=true}catch(e){}}
  function beep(f,d,t,vol){if(!AC||AC.state!=='running')return;d=d||.12;const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.22,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}
  const SONGS=[[0,4,7,12,7,4,9,7, 5,9,12,9,7,4,2,4],[0,7,12,7,5,9,12,9, 4,7,11,7,2,7,11,14],[12,11,9,7,9,7,4,2, 0,2,4,7,9,12,9,7]];
  function musicStart(n){musicStop();let i=0;const song=SONGS[n%SONGS.length],base=262*(n%2?1.12:1);
    mus=setInterval(()=>{if(!AC||AC.state!=='running')return;const s=song[i%song.length];beep(base*2**(s/12),.22,'triangle',.05);if(i%4===0)beep(base/2*2**((song[(i>>2)*4%song.length])/12),.4,'sine',.07);i++},210)}
  function musicStop(){clearInterval(mus);mus=null}
  /* ---------- rysowanie: zestaw kreskówkowy ---------- */
  const OUT='#14123a',SKIN='#ffd2a8',TAU=6.2832;
  const hsh=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  function circle(a,b,r){x.beginPath();x.arc(a,b,Math.max(0,r),0,TAU);x.fill()}
  function oc(a,b,r,col){x.fillStyle=OUT;circle(a,b,r+Math.max(2.5,r*.1));x.fillStyle=col;circle(a,b,r);if(r>14){x.fillStyle='rgba(0,0,0,.12)';x.beginPath();x.arc(a,b,r,.1*Math.PI,.9*Math.PI);x.arc(a,b-r*.25,r*.92,.85*Math.PI,.15*Math.PI,true);x.fill();x.fillStyle='rgba(255,255,255,.45)';x.beginPath();x.ellipse(a-r*.38,b-r*.42,r*.26,r*.14,-.7,0,TAU);x.fill()}}
  function ell(a,b,rx,ry,rot,col,out){if(out){x.fillStyle=OUT;x.beginPath();x.ellipse(a,b,rx+3,ry+3,rot,0,TAU);x.fill()}x.fillStyle=col;x.beginPath();x.ellipse(a,b,Math.max(0,rx),Math.max(0,ry),rot,0,TAU);x.fill();if(out&&rx>8&&ry>6){x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(a-rx*.35,b-ry*.45,rx*.3,ry*.16,rot-.3,0,TAU);x.fill()}}
