<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hopla – gry ruchowe</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--sky1:#1b1f5e;--sky2:#3a2a86;--sun:#ffd23f;--grass:#3ccf7a;--pink:#ff5fa2}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--sky1);color:#fff;font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 30%,var(--sky2),var(--sky1));z-index:5;text-align:center;padding:16px}
h1{font-size:clamp(44px,8vw,110px);margin:0;line-height:1;color:var(--sun);text-shadow:0 6px 0 #c48a00}
p{margin:0;font-size:clamp(18px,2.4vw,30px);opacity:.9}
#qr{background:#fff;padding:18px;border-radius:24px}
#code{font-size:clamp(40px,6vw,80px);font-weight:800;letter-spacing:.2em;color:var(--sun)}
.games{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
button{font:800 clamp(22px,3vw,40px) "Baloo 2",sans-serif;border:0;border-radius:28px;padding:22px 36px;cursor:pointer;color:#1b1f5e;box-shadow:0 8px 0 rgba(0,0,0,.3)}
button:focus-visible{outline:5px solid #fff}
.y{background:var(--sun)}.g{background:var(--grass)}.b{background:#7ad3ff}.w{background:#fff}
.sm{font-size:26px;padding:6px 20px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#hud{position:fixed;top:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 32px;font-size:clamp(28px,4vw,56px);font-weight:800;z-index:3;pointer-events:none;text-shadow:0 4px 0 #14123a}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,5.5vw,84px);font-weight:800;z-index:4;pointer-events:none;color:var(--sun);text-shadow:0 6px 0 #14123a;padding:0 16px}
#phone{justify-content:flex-start;gap:14px;overflow:auto;padding-top:18px}
#cam{position:relative;width:min(92vw,50vh);aspect-ratio:1;border-radius:24px;overflow:hidden;border:5px solid var(--sun);background:#000;touch-action:none;flex:none}
#cam canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.mir{transform:scaleX(-1)}
.zoom{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:800}
.hint{font-size:15px;opacity:.75;max-width:420px}
#phone .games button{font-size:22px;padding:14px 22px}
</style></head><body>
<script>
const room=new URLSearchParams(location.search).get('room');
</script>
<video id="v" playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<div id="tv" hidden>
  <canvas id="c"></canvas>
  <div id="hud" hidden><span id="score">⭐ 0</span><span id="time"></span></div>
  <div id="msg"></div>
  <div class="screen" id="pair">
    <h1>Hopla!</h1>
    <p>Zeskanuj kod aparatem w telefonie</p>
    <div id="qr"></div>
    <p>Kod pokoju: <span id="code"></span></p>
  </div>
  <div class="screen" id="menu" hidden>
    <h1>Hopla!</h1>
    <p>Wybierz grę na telefonie albo pilotem</p>
    <div class="games"><button class="y" data-g="1">⭐ Łap gwiazdki</button><button class="g" data-g="2">🪵 Skacz przez kłody</button><button class="b" data-g="3">🚗 Autko</button></div>
  </div>
</div>
<div id="phone" class="screen" hidden>
  <p id="pst">Łączę z telewizorem…</p>
  <div id="cam"><canvas id="sk" class="mir"></canvas></div>
  <div class="zoom"><button class="w sm" id="zo" aria-label="Oddal">−</button><span id="zv">1.0×</span><button class="w sm" id="zi" aria-label="Przybliż">+</button><button class="w sm" id="zr" aria-label="Reset">⟲</button><button class="w sm" id="flip" aria-label="Zmień kamerę">↻</button></div>
  <p class="hint">Przeciągnij obraz palcem, żeby go przesunąć. Ustaw tak, żeby było widać całą postać.</p>
  <div class="games"><button class="y" data-g="1">⭐ Gwiazdki</button><button class="g" data-g="2">🪵 Kłody</button><button class="b" data-g="3">🚗 Autko</button></div>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
if(room){
  $('phone').hidden=false;
  const {PoseLandmarker,FilesetResolver}=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
  const v=$('v'),sk=$('sk'),sx=sk.getContext('2d');
  let conn=null,facing='user',stream=null,z=1,cx=.5,cy=.5;
  try{const s=JSON.parse(localStorage.getItem('hoplaCam'));if(s){z=s.z;cx=s.cx;cy=s.cy}}catch(e){}
  const save=()=>{$('zv').textContent=z.toFixed(1)+'×';try{localStorage.setItem('hoplaCam',JSON.stringify({z,cx,cy}))}catch(e){}};save();
  $('zi').onclick=()=>{z=Math.min(4,z*1.25);save()};
  $('zo').onclick=()=>{z=Math.max(1,z/1.25);save()};
  $('zr').onclick=()=>{z=1;cx=.5;cy=.5;save()};
  let drag=null;
  sk.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};sk.setPointerCapture(e.pointerId)};
  sk.onpointerup=sk.onpointercancel=()=>{drag=null;save()};
  sk.onpointermove=e=>{if(!drag||!v.videoWidth)return;const S=sk.clientWidth,s=Math.min(v.videoWidth,v.videoHeight)/z;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};
    cx-=(facing==='user'?-1:1)*dx/S*s/v.videoWidth;cy-=dy/S*s/v.videoHeight};
  const peer=new Peer();
  peer.on('open',()=>{conn=peer.connect('hopla-'+room,{reliable:false});
    conn.on('open',()=>{$('pst').textContent='✅ Połączono z telewizorem';navigator.vibrate?.(80)});
    conn.on('close',()=>$('pst').textContent='Rozłączono — zeskanuj kod ponownie')});
  peer.on('error',e=>$('pst').textContent='Błąd połączenia: '+e.type);
  document.querySelectorAll('#phone [data-g]').forEach(b=>b.onclick=()=>conn?.send({t:'start',g:+b.dataset.g}));
  async function cam(){stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}});
    v.srcObject=stream;await v.play();sk.classList.toggle('mir',facing==='user')}
  $('flip').onclick=()=>{facing=facing==='user'?'environment':'user';cam()};
  await cam();
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const pose=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1});
  (function tick(){requestAnimationFrame(tick);if(v.readyState<2||!v.videoWidth)return;
    const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(vw,vh)/z;
    const X0=Math.min(vw-s,Math.max(0,cx*vw-s/2)),Y0=Math.min(vh-s,Math.max(0,cy*vh-s/2));
    cx=(X0+s/2)/vw;cy=(Y0+s/2)/vh;
    const S=Math.round(sk.clientWidth*devicePixelRatio);if(sk.width!==S){sk.width=S;sk.height=S}
    sx.drawImage(v,X0,Y0,s,s,0,0,S,S);
    const lm=pose.detectForVideo(v,performance.now()).landmarks?.[0];
    if(!lm){conn?.open&&conn.send({t:'lm',p:null});return}
    const q=lm.map(p=>[(p.x*vw-X0)/s,(p.y*vh-Y0)/s,p.visibility]);
    sx.lineCap='round';sx.lineWidth=S/70;sx.strokeStyle='#ff5fa2';
    for(const[a,b]of BONES){if(q[a][2]<.4||q[b][2]<.4)continue;sx.beginPath();sx.moveTo(q[a][0]*S,q[a][1]*S);sx.lineTo(q[b][0]*S,q[b][1]*S);sx.stroke()}
    q.forEach((p,i)=>{if(p[2]<.4)return;const hand=i===15||i===16;sx.fillStyle=hand?'#ffd23f':'#fff';sx.beginPath();sx.arc(p[0]*S,p[1]*S,hand?S/40:S/100,0,7);sx.fill()});
    const m=facing==='user';
    conn?.open&&conn.send({t:'lm',p:q.map(a=>[+(m?1-a[0]:a[0]).toFixed(3),+a[1].toFixed(3),+a[2].toFixed(2)])});
  })();
}
else {
  $('tv').hidden=false;
  const code=String(Math.floor(1000+Math.random()*9000));
  $('code').textContent=code;
  new QRCode($('qr'),{text:location.href.split('?')[0]+'?room='+code,width:260,height:260});
  const peer=new Peer('hopla-'+code);
  peer.on('error',e=>{if(e.type==='unavailable-id')location.reload()});
  peer.on('connection',cn=>{
    cn.on('open',()=>{$('pair').hidden=true;$('menu').hidden=false;document.querySelector('#menu button').focus()});
    cn.on('data',d=>{if(d.t==='lm'){raw=d.p;seen=performance.now()}if(d.t==='start')start(d.g,1)});
    cn.on('close',()=>{raw=null;back();$('pair').hidden=false;$('menu').hidden=true})});
  document.querySelectorAll('#menu [data-g]').forEach(b=>b.onclick=()=>start(+b.dataset.g,1));
  const c=$('c'),x=c.getContext('2d');let W,H;const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight};fit();addEventListener('resize',fit);
  if(!x.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(a,b,w,h){this.rect(a,b,w,h)};
  const OUT='#14123a',SKIN='#ffd2a8';
  let raw=null,seen=0,sm=[],game=null,stage=1,score=0,tStart=0,tEnd=0,items=[],parts=[],base=null,lastT=0,AC=null,shake=0,ended=false,mouth=0,drv={};
  function beep(f,d,t){d=d||.12;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
  const RX=()=>Math.min(W,H*1.5);
  const P=i=>{const a=sm[i];return a&&a[2]>.35?{x:W/2+(a[0]-.5)*RX(),y:a[1]*H}:null};
  let msgT;function say(t,ms){$('msg').textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>$('msg').textContent='',ms||900)}
  const ST=[
    {name:'Cukierkowa Łąka',sky:['#ff9ed8','#ffe3f3'],hill:'#ffc2e6',grass:['#9ff0c8','#86e6b8'],road:['#fbe3ff','#f3d2fb'],curb:['#ff5fa2','#ffffff'],amp:.5,freq:.06,speed:5,rock:0,width:1.35,prop:'lolly'},
    {name:'Grzybowy Las',sky:['#7ab8ff','#d4ecff'],hill:'#3d8f5f',grass:['#56c463','#4ab357'],road:['#d6b27a','#cba66e'],curb:['#ff3d3d','#ffffff'],amp:1.1,freq:.09,speed:7,rock:.3,width:1.15,prop:'mush'},
    {name:'Tęczowe Chmury',sky:['#1b1f5e','#7046c9'],hill:'#a58bff',grass:['#ffffff','#ece7ff'],road:['#8f7bff','#836ef2'],curb:['#ffd23f','#3ccf7a'],amp:1.5,freq:.12,speed:9,rock:.45,width:1,prop:'cloud'}];
  function start(g,s){game=g;stage=s;score=0;items=[];parts=[];base=null;ended=false;mouth=0;
    const now=performance.now();tStart=now+3000;tEnd=tStart+(g===3?45000:60000);drv={s:0,player:0,v:0,next:4,steer:0};
    $('menu').hidden=true;$('hud').hidden=false;
    say(g===1?'Łap gwiazdki rękami!':g===2?'Skacz, gdy kłoda podjedzie!':'Etap '+s+': '+ST[s-1].name+' — trzymaj kierownicę obiema rękami!',2800)}
  function back(){game=null;$('hud').hidden=true;if($('pair').hidden)$('menu').hidden=false}
  function finish(){beep(660,.3);setTimeout(()=>beep(880,.4),200);
    if(game===3&&stage<3){const n=stage+1;say('Meta! ⭐ '+score+' — teraz etap '+n,2600);setTimeout(()=>start(3,n),2700)}
    else{say('Brawo! Wynik: ⭐ '+score,4000);setTimeout(back,3500)}}
  function burst(px,py,col){for(let i=0;i<18;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*14,vy:(Math.random()-.9)*14,l:1,col})}
  function circle(a,b,r){x.beginPath();x.arc(a,b,Math.max(0,r),0,7);x.fill()}
  function oc(a,b,r,col){x.fillStyle=OUT;circle(a,b,r+4);x.fillStyle=col;circle(a,b,r)}
  function txt(s,a,b,size,col){x.font='800 '+Math.round(size)+'px "Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=size*.18;x.strokeStyle=OUT;x.strokeText(s,a,b);x.fillStyle=col;x.fillText(s,a,b)}
  function cloud(a,b,w){x.fillStyle='#fff';circle(a,b,w*.28);circle(a+w*.28,b-w*.12,w*.32);circle(a+w*.56,b,w*.26);x.fillRect(a,b-w*.05,w*.56,w*.28)}
  function hill(y,col,f,amp,ph){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+20;i+=20)x.lineTo(i,y+Math.sin(i*f+ph)*amp);x.lineTo(W,H);x.fill()}
  function bgDay(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5cc8ff');g.addColorStop(1,'#d8f4ff');x.fillStyle=g;x.fillRect(0,0,W,H);
    const a=W*.87,b=H*.17,r=H*.08;x.save();x.translate(a,b);x.rotate(t/4000);x.fillStyle='#ffe58a';
    for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.beginPath();x.moveTo(r*1.15,-r*.2);x.lineTo(r*1.75,0);x.lineTo(r*1.15,r*.2);x.fill()}x.restore();
    oc(a,b,r,'#ffd23f');x.fillStyle=OUT;circle(a-r*.3,b-r*.1,r*.1);circle(a+r*.3,b-r*.1,r*.1);x.strokeStyle=OUT;x.lineWidth=4;x.beginPath();x.arc(a,b+r*.05,r*.4,.2*Math.PI,.8*Math.PI);x.stroke();
    for(let i=0;i<5;i++){const w=H*.2;const px=((i*W*.31+t*.02*(1+i%3*.5))%(W+w*2))-w;cloud(px,H*(.1+i%3*.08),w)}
    hill(H*.62,'#a7e889',.004,H*.05,t*.0002);hill(H*.72,'#72d36b',.006,H*.04,1.5);
    x.fillStyle='#4cbf5a';x.fillRect(0,H*.88,W,H*.12)}
  function star(a,b,r,rot,gold){x.save();x.translate(a,b);x.rotate(rot);x.beginPath();for(let i=0;i<10;i++){const an=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}x.closePath();
    x.lineJoin='round';x.lineWidth=6;x.strokeStyle=OUT;x.stroke();x.fillStyle=gold?'#ff9f1c':'#ffd23f';x.fill();
    x.fillStyle=OUT;circle(-r*.2,-r*.05,r*.09);circle(r*.2,-r*.05,r*.09);x.strokeStyle=OUT;x.lineWidth=3;x.beginPath();x.arc(0,r*.08,r*.15,.15*Math.PI,.85*Math.PI);x.stroke();
    x.fillStyle='rgba(255,110,140,.5)';circle(-r*.33,r*.12,r*.08);circle(r*.33,r*.12,r*.08);x.restore()}
  function limb(pts,col,w){if(pts.some(p=>!p))return;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)x.lineTo(pts[i].x,pts[i].y);
    x.strokeStyle=OUT;x.lineWidth=w+8;x.stroke();x.strokeStyle=col;x.lineWidth=w;x.stroke()}
  const mid=(a,b,k)=>({x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k});
  function avatar(t){const LS=P(11),RS=P(12);if(!LS||!RS)return;
    const sw=Math.hypot(LS.x-RS.x,LS.y-RS.y)||40,w=Math.max(16,sw*.34);
    const LH=P(23)||{x:LS.x,y:LS.y+sw*1.4},RH=P(24)||{x:RS.x,y:RS.y+sw*1.4};
    const LK=P(25)||{x:LH.x,y:LH.y+sw},RK=P(26)||{x:RH.x,y:RH.y+sw},LA=P(27)||{x:LK.x,y:LK.y+sw},RA=P(28)||{x:RK.x,y:RK.y+sw};
    limb([LH,LK,LA],'#3b5bdb',w*1.15);limb([RH,RK,RA],'#3b5bdb',w*1.15);
    for(const A of[LA,RA]){x.fillStyle=OUT;x.beginPath();x.ellipse(A.x,A.y+w*.25,w*.75+4,w*.45+4,0,0,7);x.fill();x.fillStyle='#ff3d6e';x.beginPath();x.ellipse(A.x,A.y+w*.25,w*.75,w*.45,0,0,7);x.fill()}
    x.beginPath();x.moveTo(LS.x,LS.y);x.lineTo(RS.x,RS.y);x.lineTo(RH.x,RH.y);x.lineTo(LH.x,LH.y);x.closePath();x.lineJoin='round';
    x.strokeStyle=OUT;x.lineWidth=w*1.2+8;x.stroke();x.strokeStyle='#ff8a3d';x.lineWidth=w*1.2;x.stroke();x.fillStyle='#ff8a3d';x.fill();
    limb([mid(LS,LH,.45),mid(RS,RH,.45)],'#ffd23f',w*.45);
    const neck=mid(LS,RS,.5),N=P(0),hc=N?{x:N.x,y:N.y}:{x:neck.x,y:neck.y-sw*.8},hr=sw*.55;
    limb([neck,hc],SKIN,w*.7);
    for(const[s,e,h]of[[LS,P(13),P(15)],[RS,P(14),P(16)]]){if(!e)continue;limb([s,e],'#ff8a3d',w);limb([e,h||e],SKIN,w*.85);if(h)oc(h.x,h.y,w*.7,SKIN)}
    const[A,B]=LS.x<RS.x?[LS,RS]:[RS,LS];
    x.save();x.translate(hc.x,hc.y);x.rotate(Math.atan2(B.y-A.y,B.x-A.x)*.7);
    oc(0,0,hr,SKIN);oc(-hr*.95,hr*.05,hr*.18,SKIN);oc(hr*.95,hr*.05,hr*.18,SKIN);x.fillStyle=SKIN;circle(0,0,hr);
    x.fillStyle='#7a3e1d';x.beginPath();x.arc(0,0,hr*1.03,Math.PI*1.02,Math.PI*1.98);x.quadraticCurveTo(hr*.3,-hr*.25,-hr*1.0,-hr*.1);x.fill();
    x.beginPath();x.ellipse(hr*.1,-hr*1.08,hr*.16,hr*.3,.5+Math.sin(t/200)*.15,0,7);x.fill();
    const blink=(t%3300)<140,ex=hr*.36,ey=hr*.02;
    for(const s of[-1,1]){if(blink){x.strokeStyle=OUT;x.lineWidth=5;x.beginPath();x.moveTo(s*ex-hr*.15,ey);x.lineTo(s*ex+hr*.15,ey);x.stroke()}
      else{x.fillStyle='#fff';x.beginPath();x.ellipse(s*ex,ey,hr*.17,hr*.22,0,0,7);x.fill();x.fillStyle=OUT;circle(s*ex+hr*.03,ey+hr*.04,hr*.1);x.fillStyle='#fff';circle(s*ex+hr*.07,ey-hr*.01,hr*.035)}}
    x.fillStyle='rgba(255,110,140,.5)';circle(-hr*.58,hr*.32,hr*.13);circle(hr*.58,hr*.32,hr*.13);
    if(mouth>0){x.fillStyle=OUT;x.beginPath();x.ellipse(0,hr*.45,hr*.16,hr*.2,0,0,7);x.fill();x.fillStyle='#ff6b8b';x.beginPath();x.ellipse(0,hr*.52,hr*.1,hr*.08,0,0,7);x.fill()}
    else{x.strokeStyle=OUT;x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(0,hr*.28,hr*.26,.2*Math.PI,.8*Math.PI);x.stroke()}
    x.restore()}
  function gStars(t,dt,on){bgDay(t);
    if(on&&Math.random()<dt/650)items.push({x:W/2+(Math.random()-.5)*RX()*.85,y:-60,vy:2+Math.random()*1.5+score*.03,r:H*.06,rot:Math.random()*6,gold:Math.random()<.15});
    const hands=[P(15),P(16)].filter(Boolean);
    items=items.filter(s=>{s.y+=s.vy*dt/16;s.rot+=.03;
      if(hands.some(h=>Math.hypot(h.x-s.x,h.y-s.y)<s.r+H*.05)){score+=s.gold?3:1;burst(s.x,s.y,s.gold?'#ff9f1c':'#ffd23f');beep(700+score*15);mouth=500;if(score%5===0)say(['Super!','Brawo!','Wow!'][score%3]);return false}
      star(s.x,s.y,s.r,Math.sin(s.rot)*.35,s.gold);return s.y<H+80});
    avatar(t)}
  function log(a,gy,r,spin){x.fillStyle=OUT;x.beginPath();x.roundRect(a-r*1.9-4,gy-r*2-4,r*3.8+8,r*2+8,r);x.fill();x.fillStyle='#a0612e';x.beginPath();x.roundRect(a-r*1.9,gy-r*2,r*3.8,r*2,r);x.fill();
    x.strokeStyle='#7d4620';x.lineWidth=4;for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(a+i*r,gy-r*1.7);x.lineTo(a+i*r+r*.3,gy-r*.3);x.stroke()}
    oc(a-r*1.6,gy-r,r*.9,'#e5a868');x.save();x.translate(a-r*1.6,gy-r);x.rotate(spin);x.strokeStyle='#b97a40';x.lineWidth=3;x.beginPath();x.arc(0,0,r*.55,0,5);x.stroke();x.beginPath();x.arc(0,0,r*.25,1,6);x.stroke();x.restore();
    x.fillStyle='#4cbf5a';x.beginPath();x.ellipse(a+r*.6,gy-r*2.1,r*.35,r*.15,-.5,0,7);x.fill()}
  function gLogs(t,dt,on){bgDay(t);const gy=H*.9;
    const hl=P(23),hr=P(24);let jumping=false,px=W/2;
    if(hl&&hr){const hy=(hl.y+hr.y)/2;px=(hl.x+hr.x)/2;base=base==null?hy:(hy>base-H*.02?base*.97+hy*.03:base);jumping=hy<base-H*.05}
    if(on&&Math.random()<dt/1700&&!items.some(o=>o.x>W*.6))items.push({x:W+150,ok:false,spin:0});
    x.fillStyle='rgba(0,0,0,.2)';x.beginPath();x.ellipse(px,gy,H*.1*(jumping?.6:1),H*.02,0,0,7);x.fill();
    items=items.filter(o=>{o.x-=W*.0045*dt/16*(1+score*.03);o.spin-=dt*.008;log(o.x,gy,H*.06,o.spin);
      if(!o.ok&&Math.abs(o.x-px)<H*.08){o.ok=true;if(jumping){score++;burst(px,gy-H*.1,'#3ccf7a');beep(520+score*25,.15,'triangle');say('Hop!');mouth=500}else{beep(160,.25,'square');say('Ups!');shake=18}}
      return o.x>-200});
    avatar(t);
    if(on)txt(jumping?'W GÓRZE!':'Skacz ↑',px,H*.96,H*.04,jumping?'#ffd23f':'#fff')}
  const Cv=(s,S)=>S.amp*(Math.sin(s*S.freq)+.5*Math.sin(s*S.freq*2.3+1));
  function prop(type,a,b,sz,t){if(sz<4)return;
    if(type==='lolly'){limb([{x:a,y:b},{x:a,y:b-sz}],'#fff',sz*.06);oc(a,b-sz,sz*.3,'#ff5fa2');x.strokeStyle='#fff';x.lineWidth=sz*.06;x.beginPath();x.arc(a,b-sz,sz*.18,0,4.5);x.stroke();x.beginPath();x.arc(a,b-sz,sz*.07,2,6);x.stroke()}
    else if(type==='mush'){x.fillStyle=OUT;x.beginPath();x.roundRect(a-sz*.14-3,b-sz*.55,sz*.28+6,sz*.55+3,sz*.08);x.fill();x.fillStyle='#fff3d6';x.beginPath();x.roundRect(a-sz*.14,b-sz*.52,sz*.28,sz*.52,sz*.08);x.fill();
      x.fillStyle=OUT;x.beginPath();x.ellipse(a,b-sz*.55,sz*.48,sz*.38,0,Math.PI,0);x.fill();x.fillStyle='#ff3d3d';x.beginPath();x.ellipse(a,b-sz*.57,sz*.44,sz*.34,0,Math.PI,0);x.fill();
      x.fillStyle='#fff';circle(a-sz*.2,b-sz*.72,sz*.07);circle(a+sz*.15,b-sz*.8,sz*.09);circle(a+sz*.28,b-sz*.63,sz*.05)}
    else{cloud(a-sz*.3,b-sz*.3,sz*.7);x.fillStyle='#ffd23f';const k=.6+.4*Math.sin(t/200+a);circle(a+sz*.3,b-sz*.8,sz*.05*k)}}
  function rock(a,b,r){x.fillStyle=OUT;x.beginPath();x.ellipse(a,b-r*.6,r+4,r*.75+4,0,0,7);x.fill();x.fillStyle='#9aa0b5';x.beginPath();x.ellipse(a,b-r*.6,r,r*.75,0,0,7);x.fill();
    x.fillStyle='#c3c8d8';circle(a-r*.35,b-r*.95,r*.18);x.fillStyle=OUT;circle(a-r*.3,b-r*.55,r*.1);circle(a+r*.3,b-r*.55,r*.1);
    x.strokeStyle=OUT;x.lineWidth=3;x.beginPath();x.moveTo(a-r*.45,b-r*.8);x.lineTo(a-r*.15,b-r*.7);x.moveTo(a+r*.45,b-r*.8);x.lineTo(a+r*.15,b-r*.7);x.stroke()}
  function car(a,b,s,steer,t,v){x.save();x.translate(a,b+(v>.5?Math.sin(t/70)*s*.015:0));x.rotate(steer*.15);
    x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(0,s*.45,s*.8,s*.12,0,0,7);x.fill();
    x.fillStyle=OUT;for(const wx of[-.56,.56]){x.beginPath();x.roundRect(wx*s-s*.15,s*.1,s*.3,s*.34,s*.08);x.fill()}
    x.beginPath();x.roundRect(-s*.74,-s*.14,s*1.48,s*.52,s*.2);x.fill();x.fillStyle='#ff4d5e';x.beginPath();x.roundRect(-s*.7,-s*.1,s*1.4,s*.44,s*.17);x.fill();
    x.fillStyle=OUT;x.beginPath();x.roundRect(-s*.46,-s*.52,s*.92,s*.46,s*.2);x.fill();x.fillStyle='#ff4d5e';x.beginPath();x.roundRect(-s*.42,-s*.48,s*.84,s*.4,s*.17);x.fill();
    x.fillStyle='#bdeeff';x.beginPath();x.roundRect(-s*.34,-s*.42,s*.68,s*.27,s*.1);x.fill();
    x.fillStyle=SKIN;circle(-s*.14,-s*.25,s*.04);circle(s*.14,-s*.25,s*.04);x.fillStyle='#7a3e1d';circle(0,-s*.27,s*.13);
    x.fillStyle='#fff';x.globalAlpha=.5;x.beginPath();x.roundRect(-s*.6,-s*.06,s*.5,s*.07,s*.03);x.fill();x.globalAlpha=1;
    oc(-s*.53,s*.1,s*.07,'#ffd23f');oc(s*.53,s*.1,s*.07,'#ffd23f');
    x.fillStyle='#fff';x.fillRect(-s*.17,s*.12,s*.34,s*.13);txt('HOPLA',0,s*.19,s*.1,'#1b1f5e');x.restore();
    if(v>1&&Math.random()<.35)parts.push({x:a+(Math.random()<.5?-1:1)*s*.4,y:b+s*.3,vx:(Math.random()-.5)*2,vy:1.5,l:1,col:'#ffffff',puff:true})}
  function wheelHud(grip,steer){const a=W*.1,b=H*.8,r=H*.1;x.save();x.translate(a,b);x.rotate(steer*1.3);
    x.strokeStyle=OUT;x.lineWidth=r*.32;x.beginPath();x.arc(0,0,r,0,7);x.stroke();x.strokeStyle='#3b5bdb';x.lineWidth=r*.22;x.beginPath();x.arc(0,0,r,0,7);x.stroke();
    limb([{x:-r,y:0},{x:r,y:0}],'#3b5bdb',r*.14);limb([{x:0,y:0},{x:0,y:r}],'#3b5bdb',r*.14);oc(0,0,r*.22,'#ffd23f');
    if(grip){oc(-r,0,r*.2,SKIN);oc(r,0,r*.2,SKIN)}x.restore()}
  function gDrive(t,dt,on){const S=ST[stage-1],hz=H*.4;
    const a=P(15),b=P(16);let steer=0,grip=false;
    if(a&&b){const L=a.x<b.x?a:b,R=a.x<b.x?b:a;steer=Math.max(-1,Math.min(1,Math.atan2(R.y-L.y,R.x-L.x)/.6));grip=true}
    drv.steer+=(steer-drv.steer)*.2;
    const off=Math.abs(drv.player)>1.05;
    drv.v+=((on?S.speed*(off?.45:1)*(grip?1:.5):0)-drv.v)*.03;
    drv.s+=drv.v*dt/1000;
    const drift=Cv(drv.s+3,S)-Cv(drv.s,S);
    drv.player+=(drv.steer*1.5-drift*.9)*dt/1000*(drv.v/S.speed)*1.3;
    drv.player=Math.max(-1.8,Math.min(1.8,drv.player));
    if(off&&drv.v>1)shake=Math.max(shake,5);
    const C0=Cv(drv.s,S);
    const g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);x.fillStyle=g;x.fillRect(0,0,W,hz+4);
    if(stage===3){for(let i=0;i<50;i++){x.globalAlpha=.5+.5*Math.sin(t/300+i*7);x.fillStyle='#fff';circle((i*137.5+C0*-80)%W+(i*137.5+C0*-80<0?W:0),(i*53)%(hz*.9),2+i%3);}x.globalAlpha=1;
      x.fillStyle='#fff8c8';circle(W*.8,H*.1,H*.05)}
    else{for(let i=0;i<4;i++){const w=H*.16;cloud(((i*W*.33-C0*W*.15+t*.01)%(W+w*2)+W+w*2)%(W+w*2)-w,H*(.07+i%2*.08),w)}}
    hill(hz-H*.02,S.hill,.005,H*.06,C0*2);
    for(let y=H;y>hz;y-=3){const p=(y-hz)/(H-hz),d=(1/p-1)*4,hw=p*W*.42*S.width,cx=W/2+(Cv(drv.s+d,S)-C0)*W*.4*(1-p)-drv.player*hw,band=Math.floor((drv.s+d)*1.2)%2;
      x.fillStyle=S.grass[band];x.fillRect(0,y-3,W,4);x.fillStyle=S.curb[band];x.fillRect(cx-hw*1.12,y-3,hw*2.24,4);x.fillStyle=S.road[band];x.fillRect(cx-hw,y-3,hw*2,4);
      if(band){x.fillStyle='rgba(255,255,255,.85)';x.fillRect(cx-hw*.03,y-3,hw*.06,4)}}
    const geo=d=>{const p=1/(1+d/4),hw=p*W*.42*S.width;return{p,y:hz+p*(H-hz),hw,cx:W/2+(Cv(drv.s+d,S)-C0)*W*.4*(1-p)-drv.player*hw}};
    if(on&&drv.s>drv.next){drv.next+=2+Math.random()*1.6;items.push({q:drv.s+40,lane:(Math.random()*2-1)*.7,type:Math.random()<S.rock?'rock':'star',hit:false})}
    const th=[];for(let n=Math.ceil(drv.s/4);n*4<drv.s+40;n++)th.push({q:n*4,prop:true,side:n%2?1:-1});
    th.push(...items);th.sort((A,B)=>B.q-A.q);
    for(const o of th){const d=o.q-drv.s;if(d<0)continue;const G=geo(d),sz=G.p*H*.5;
      if(o.prop)prop(S.prop,G.cx+o.side*G.hw*1.75,G.y,sz,t);
      else if(!o.hit){const ox=G.cx+o.lane*G.hw;if(o.type==='star')star(ox,G.y-sz*.3,sz*.22,Math.sin(t/300+o.q)*.3,false);else rock(ox,G.y,sz*.3);
        if(d<1.6&&d>.7&&Math.abs(o.lane-drv.player)<.35){o.hit=true;if(o.type==='star'){score++;burst(W/2,H*.72,'#ffd23f');beep(700+score*15)}else{drv.v*=.3;shake=22;beep(140,.3,'square');say('Bum!')}}}}
    items=items.filter(o=>o.q-drv.s>-1&&!o.hit);
    car(W/2,H*.84,H*.17,drv.steer,t,drv.v);
    wheelHud(grip,drv.steer);
    txt('Etap '+stage+' · '+S.name,W/2,H*.05,H*.04,'#fff');
    if(on&&!grip&&sm.length)txt('Złap kierownicę obiema rękami!',W/2,H*.3,H*.05,'#ffd23f')}
  (function loop(t){requestAnimationFrame(loop);const dt=Math.min(50,t-(lastT||t));lastT=t;
    if(raw&&t-seen<1000){raw.forEach((a,i)=>{const b=sm[i];if(!b||b[2]<.2)sm[i]=a.slice();else{b[0]+=(a[0]-b[0])*.5;b[1]+=(a[1]-b[1])*.5;b[2]=a[2]}})}else sm=[];
    mouth=Math.max(0,mouth-dt);
    x.save();if(shake>.5){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}
    if(!game){bgDay(t);x.restore();return}
    const cd=tStart-t,on=cd<=0&&!ended,left=Math.max(0,Math.ceil((tEnd-t)/1000));
    $('time').textContent='⏱ '+(cd>0?Math.round((tEnd-tStart)/1000):left);$('score').textContent='⭐ '+score;
    if(game===1)gStars(t,dt,on);else if(game===2)gLogs(t,dt,on);else gDrive(t,dt,on);
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.puff?-.05:.45;p.l-=p.puff?.02:.022;x.globalAlpha=Math.max(0,p.l)*(p.puff?.6:1);x.fillStyle=p.col;
      if(p.puff)circle(p.x,p.y,(1-p.l)*H*.03+4);else{x.save();x.translate(p.x,p.y);x.rotate(p.l*6);x.fillRect(-6,-6,12,12);x.restore()}x.globalAlpha=1;return p.l>0});
    x.restore();
    if(cd>0)txt(String(Math.ceil(cd/1000)),W/2,H*.5,H*.3,'#ffd23f');
    if(!sm.length)txt('Nie widzę cię — ustaw telefon tak, żeby było widać całą postać',W/2,H*.18,Math.min(H*.045,W*.03),'#fff');
    if(on&&left===0){ended=true;finish()}
  })();
}
