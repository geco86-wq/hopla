  function bdGeo(){const TW=Math.min(W*.9,H*1.75),TH=TW/2,tx=(W-TW)/2,ty=(H-TH)/2+H*.02,rail=TW*.045;return{TW,TH,tx,ty,rail,x0:tx+rail,x1:tx+TW-rail,y0:ty+rail,y1:ty+TH-rail,r:TW*.016}}
  function bdRack(s,n){const g=bdGeo(),cols=['#ffd23f','#5f8bff','#ff6b6b','#b58cff','#ff9f43','#6be28a','#d63a8a','#8a5a2b','#222244','#5fd0ff'];s.balls=[{x:g.x0+(g.x1-g.x0)*.25,y:(g.y0+g.y1)/2,vx:0,vy:0,col:'#fff',num:0}];let i=0,row=0;while(i<n){for(let j=0;j<=row&&i<n;j++,i++)s.balls.push({x:g.x0+(g.x1-g.x0)*.68+row*g.r*1.75,y:(g.y0+g.y1)/2+(j-row/2)*g.r*2.05,vx:0,vy:0,col:cols[i%10],num:i+1});row++}}

    init(s){Object.assign(s,{n:6,aim:0,pw:0,wasA:0,shot:0,lev:0});bdRack(s,s.n)},

          s.aim+=axX(k)*(k&32?.3:1.1)*SENS*d;

        s.wasA=A;
        const N=4,h=d/N;for(let it=0;it<N;it++){
          for(const b of s.balls){b.x+=b.vx*h;b.y+=b.vy*h;const f=Math.pow(.38,h);b.vx*=f;b.vy*=f;if(Math.hypot(b.vx,b.vy)<G.TW*.012){b.vx=b.vy=0}
            if(b.x<G.x0+r){b.x=G.x0+r;b.vx=Math.abs(b.vx)*.85}if(b.x>G.x1-r){b.x=G.x1-r;b.vx=-Math.abs(b.vx)*.85}if(b.y<G.y0+r){b.y=G.y0+r;b.vy=Math.abs(b.vy)*.85}if(b.y>G.y1-r){b.y=G.y1-r;b.vy=-Math.abs(b.vy)*.85}}
          for(let i=0;i<s.balls.length;i++)for(let j=i+1;j<s.balls.length;j++){const a=s.balls[i],b=s.balls[j],dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);if(dd<r*2&&dd>0){const nx=dx/dd,ny=dy/dd,ov=r*2-dd;a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){a.vx+=vn*nx;a.vy+=vn*ny;b.vx-=vn*nx;b.vy-=vn*ny;beep(900,.03,'triangle',Math.min(.15,-vn/G.TW*.2))}}}
          for(let i=s.balls.length-1;i>=0;i--){const b=s.balls[i];if(pk.some(p=>Math.hypot(b.x-p[0],b.y-p[1])<pr)){
            if(i===0){miss('Biała wpadła!');b.x=G.x0+(G.x1-G.x0)*.25;b.y=(G.y0+G.y1)/2;b.vx=b.vy=0;shake=10}
            else{s.shot++;cur.score+=s.shot;floats.push({x:b.x,y:b.y,t:'+'+s.shot,l:1,col:'#ffd23f'});burst(b.x,b.y,b.col,10);beep(400+s.shot*120,.15,'triangle',.15);s.balls.splice(i,1);

      }
      skyG('#1b4d3a','#0f2e24',H);
      box(G.tx,G.ty,G.TW,G.TH,G.TW*.04,'#7a4a2a');x.fillStyle='#1f9d55';x.fillRect(G.x0,G.y0,G.x1-G.x0,G.y1-G.y0);x.fillStyle='rgba(255,255,255,.07)';x.fillRect(G.x0,G.y0,(G.x1-G.x0)*.5,G.y1-G.y0);

      if(!mov&&on){const dx=Math.cos(s.aim),dy=Math.sin(s.aim);let tmin=G.TW*.6;for(let i=1;i<s.balls.length;i++){const b=s.balls[i],px=b.x-cb.x,py=b.y-cb.y,pr2=px*dx+py*dy;if(pr2>0){const pp=px*px+py*py-pr2*pr2;if(pp<4*r*r)tmin=Math.min(tmin,pr2-Math.sqrt(4*r*r-pp))}}
        x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;x.setLineDash([8,8]);x.beginPath();x.moveTo(cb.x,cb.y);x.lineTo(cb.x+dx*tmin,cb.y+dy*tmin);x.stroke();x.setLineDash([]);x.strokeStyle='rgba(255,255,255,.6)';x.beginPath();x.arc(cb.x+dx*tmin,cb.y+dy*tmin,r,0,TAU);x.stroke();

        box(W*.3,H*.945,W*.4,H*.03,8,'#14123a');box(W*.3+3,H*.945+3,Math.max(0,(W*.4-6)*s.pw),H*.03-6,6,s.pw>.8?'#ff5f5f':'#6be28a',false)}
      txt('Bile: '+(s.balls.length-1),H*.03,H*.2,H*.045,'#fff','left');
      if(cur.el<8000)txt('◀ ▶ celuj (B wolniej) · przytrzymaj A, żeby nabrać siły, puść = uderzenie',W/2,H*.9,H*.032,'#fff')}});

  let fpsLow=0,lastOk=0;

      if(t>cur.ot){if(ed(4))OPT_ROW.r=(OPT_ROW.r+rows.length-1)%rows.length;if(ed(8))OPT_ROW.r=(OPT_ROW.r+1)%rows.length;const rw=rows[OPT_ROW.r%rows.length],dv=ed(2)?1:ed(1)?-1:0;if(dv){cur.o[rw.k]=(cur.o[rw.k]+dv+rw.v.length)%rw.v.length;SENS=SENSV[cur.o.sens];try{localStorage.setItem('hoplaO'+cur.i,JSON.stringify(cur.o))}catch(e){}beep(500,.05,'square',.08)}
        if(ed(16)||ed(32)){cur.tStart=t+2200;beep(660,.1)}}
