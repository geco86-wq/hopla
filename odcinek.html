<title>Odcinek Specjalny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; menus as a left "timing board" column; HUD pinned to corners like a rally broadcast */
:root{
  --ink:#0c0f10; --panel:rgba(12,15,16,.9); --line:rgba(236,232,220,.14); --fg:#ece8dc; --mute:#9a9d93;
  --accent:#f2c230; --gravel:#cdb68c; --bad:#e5533f; --good:#5cc985; --on-accent:#141310;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif; --body:'Saira','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- menus ---------- */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex}
.side{width:min(470px,100%);height:100%;box-sizing:border-box;padding-block:max(30px,env(safe-area-inset-top,0px)) 28px;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:30px;
  background:linear-gradient(90deg,rgba(10,12,13,.95) 0%,rgba(10,12,13,.88) 72%,rgba(10,12,13,0) 100%);display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.wide{width:min(760px,100%);background:linear-gradient(90deg,rgba(10,12,13,.96) 0%,rgba(10,12,13,.92) 85%,rgba(10,12,13,0) 100%);padding-right:60px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--gravel)}
h1.logo{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(52px,9vw,78px);line-height:.86;margin:6px 0 0;color:var(--accent);letter-spacing:-.01em;text-wrap:balance}
h1.logo span{display:block;color:var(--fg)}
.sub{color:var(--mute);font-size:14px;margin-top:10px}
h2{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:40px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.menu{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.mbtn{position:relative;font-family:var(--display);font-size:27px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:none;border:0;text-align:left;padding:7px 16px;cursor:pointer;z-index:0}
.mbtn small{display:block;font-family:var(--body);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mute)}
.mbtn::before{content:"";position:absolute;inset:0;background:var(--accent);transform:skewX(-10deg) scaleX(0);transform-origin:left;transition:transform .14s ease;z-index:-1}
.mbtn:hover::before,.mbtn:focus-visible::before{transform:skewX(-10deg) scaleX(1)}
.mbtn:hover,.mbtn:focus-visible{color:var(--on-accent);outline:none}
.mbtn:hover small,.mbtn:focus-visible small{color:#3b372b}
.foot{margin-top:auto;color:var(--mute);font-size:12px;line-height:1.6}
kbd{font-family:var(--display);font-weight:700;background:rgba(236,232,220,.1);border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:13px;color:var(--fg)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;padding:10px 20px;border:1px solid var(--line);background:rgba(236,232,220,.05);cursor:pointer;border-radius:2px}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover,.btn.primary:focus-visible{background:#ffd451}

.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:rgba(236,232,220,.03);cursor:pointer;text-align:left;border-radius:2px}
.stage canvas{width:76px;height:56px;display:block}
.stage .nm{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1}
.stage .rg{font-size:12px;color:var(--mute);margin-top:3px}
.stage .meta{text-align:right;font-family:var(--display);font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1.3}
.stage .meta b{color:var(--fg);font-weight:700}
.stage[aria-pressed="true"]{border-color:var(--accent);background:rgba(242,194,48,.09)}
.stage:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:2px;background:rgba(205,182,140,.18);color:var(--gravel)}
.chip.snow{background:rgba(170,200,230,.18);color:#bcd3ea}.chip.tarmac{background:rgba(236,232,220,.12);color:var(--fg)}

.opts{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line)}
.orow:focus-visible,.orow:focus-within{background:rgba(242,194,48,.08);outline:none}
.orow .lb{font-size:15px;min-width:0}
.orow .lb small{display:block;color:var(--mute);font-size:12px}
.sel{display:flex;align-items:center;gap:4px}
.sel button{width:30px;height:30px;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px;border-radius:2px}
.sel button:hover{border-color:var(--accent)}
.sel span{min-width:150px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase}
.tog{width:64px;height:30px;border:1px solid var(--line);background:rgba(236,232,220,.06);cursor:pointer;font-family:var(--display);font-weight:700;border-radius:2px}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{width:170px;accent-color:#f2c230}
.rng .v{min-width:44px;text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);width:170px}
.rngw{display:flex;flex-direction:column;gap:2px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(236,232,220,.3);cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ink) inset}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;padding:6px 14px;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--mute);margin-bottom:6px}
.hint{font-size:13px;color:var(--mute);line-height:1.5;max-width:60ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;align-items:center;font-size:14px}
.keys dt{text-align:right}
.keys dd{margin:0;color:var(--mute)}

table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td,table.res th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
table.res th{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
table.res td.t,table.res th.t{text-align:right;font-family:var(--display);font-weight:700;font-size:17px}
table.res tr.me td{background:rgba(242,194,48,.12);color:var(--accent)}
table.res td.pos{font-family:var(--display);font-weight:800;width:28px}
.cc{color:var(--mute);font-size:12px;margin-left:6px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-family:var(--display);font-weight:600}
.stat .v{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:var(--ink);font-family:var(--display);font-weight:800;font-style:italic;font-size:34px;text-transform:uppercase;color:var(--accent);letter-spacing:.02em;text-align:center;padding:0 20px}
#loading small{display:block;font-family:var(--body);font-style:normal;font-weight:400;font-size:14px;color:var(--mute);text-transform:none;margin-top:8px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;font-family:var(--display)}
.stagebar{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(320px,40vw)}
.stagebar .nm{font-weight:800;font-style:italic;text-transform:uppercase;font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.track{position:relative;height:6px;background:rgba(0,0,0,.45);margin-top:6px;border:1px solid rgba(236,232,220,.25)}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.track i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.splits{margin-top:8px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:2px}
.timer{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;background:rgba(10,12,13,.72);padding:4px 18px 6px;border-bottom:3px solid var(--accent)}
.timer .t{font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer .d{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;min-height:20px}
.ahead{color:var(--good)}.behind{color:var(--bad)}
#notes{position:absolute;top:calc(max(14px,env(safe-area-inset-top,0px)) + 86px);left:50%;transform:translateX(-50%);display:flex;gap:10px}
.note{display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .2s}
.note canvas{width:96px;height:96px}
.note span{font-weight:800;font-size:17px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8);letter-spacing:.02em}
.note.second{opacity:.6;transform:scale(.86);transform-origin:top center}
#tacho{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:230px;height:230px}
.dmg{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.parts{display:grid;grid-template-columns:repeat(3,auto);gap:3px 5px;margin-top:5px;width:max-content}
.parts span{font-size:11px;letter-spacing:.05em;padding:1px 6px;border-left:3px solid var(--good);background:rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.dmg .cam{margin-top:10px;color:var(--mute);font-size:12px}
#rhud{position:fixed;inset:0;z-index:5;pointer-events:none;font-family:var(--display)}
.rp-tag{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-weight:800;font-style:italic;font-size:30px;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.7);letter-spacing:.04em}
.rp-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(560px,80vw);background:rgba(10,12,13,.72);padding:8px 14px 10px}
.rp-info{margin-top:6px;font-size:14px;font-weight:600;color:var(--fg);text-align:center;font-variant-numeric:tabular-nums}
.svcbar{position:relative;height:10px;background:rgba(0,0,0,.45);border:1px solid var(--line);margin-top:6px}
.svcbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.svc-r{display:flex;align-items:center;gap:12px}
.svc-r .pct{min-width:48px;text-align:right;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
#msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-style:italic;font-size:44px;text-transform:uppercase;color:var(--fg);text-shadow:0 2px 10px rgba(0,0,0,.7);text-align:center;white-space:nowrap}
#msg.warn{color:var(--bad)}
#count{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-style:italic;font-size:150px;line-height:1;color:var(--accent);text-shadow:0 4px 24px rgba(0,0,0,.6)}
#fps{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border:2px solid rgba(236,232,220,.35);background:rgba(10,12,13,.35);border-radius:50%;font-family:var(--display);font-weight:800;font-size:18px;color:var(--fg);display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(242,194,48,.5);border-color:var(--accent)}
body.touch #tacho{bottom:auto;top:max(60px,env(safe-area-inset-top,0px));width:150px;height:150px}
body.touch .dmg{display:none}
@media (max-width:640px){
  .timer .t{font-size:30px} #notes{top:calc(max(14px,env(safe-area-inset-top,0px)) + 64px)} .note canvas{width:72px;height:72px}
  .stagebar{width:34vw}.stagebar .nm{font-size:15px}
  .sel span{min-width:104px;font-size:16px}.rng input,.ends{width:120px}
  .wide{padding-right:30px}
  #msg{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.mbtn::before{transition:none}}
</style>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(typeof THREE==='undefined'){$('#loading').innerHTML='<div>Brak silnika 3D<small>Nie udało się wczytać biblioteki. Odśwież stronę.</small></div>';return}

/* ====================== helpers ====================== */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function rngf(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function h2(ix,iz,s){let h=Math.imul(ix,374761393)^Math.imul(iz,668265263)^Math.imul(s,1274126177);h=Math.imul(h^(h>>>13),1103515245);h^=h>>>16;return(h>>>0)/4294967295}
function vn(x,z,s){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);const a=h2(ix,iz,s),b=h2(ix+1,iz,s),c=h2(ix,iz+1,s),d=h2(ix+1,iz+1,s);return(a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz)*2-1}
function fbm(x,z,s,o){let t=0,a=.5,f=1;for(let i=0;i<(o||4);i++){t+=a*vn(x*f,z*f,s+i*101);f*=2.02;a*=.5}return t}
const C=hex=>new THREE.Color(hex).convertSRGBToLinear();
const fmt=t=>{if(!isFinite(t))return'—';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)};
const fmtD=d=>(d<0?'−':'+')+Math.abs(d).toFixed(2);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function rgba(hex,a){const c=new THREE.Color(hex);return`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${a})`}

/* ====================== settings ====================== */
const OPT_DEF={quality:'high',shadows:true,trees:1,view:1,fov:68,dust:true,shake:true,fps:false,gearbox:'auto',camera:2,units:'kmh',difficulty:'med',damage:'real',abs:true,tc:false,assist:true,notesHud:true,voice:true,vol:.8,volEng:.8,volFx:.8,volVoice:1,sens:1,kbSpeed:1,dead:.08,post:true,bloom:true,rainfx:true,speedblur:true,rumble:true};
const SETUP_DEF={tyre:'gravel',gears:.45,susp:.4,height:.6,brake:.6,diff:.6,lock:.6,color:'#c8102e'};
let OPT=Object.assign({},OPT_DEF,LS.get('os_opt',{}));
let SETUP=Object.assign({},SETUP_DEF,LS.get('os_setup',{}));
const saveOpt=()=>LS.set('os_opt',OPT), saveSetup=()=>LS.set('os_setup',SETUP);

/* ====================== data ====================== */
const STAGES=[
 {id:'las',name:'Las Borowy',region:'Warmia · Polska',surface:'gravel',surfName:'Szuter',seed:7,len:4300,W:7.2,hAmp:26,hScale:600,dAmp:4,mtn:70,bumps:1.1,veg:'pine',dens:1.3,verge:-.42,grade:.1,
  pal:{road:'#a3906f',rut:'#6a5c48',edge:'#b9a785',g1:'#465f2e',g2:'#6f783b',dirt:'#7a6a4f',rock:'#77736b',dust:'#c4ae88'},champ:['day','dry']},
 {id:'tysiac',name:'Tysiąc Jezior',region:'Jyväskylä · Finlandia',surface:'gravel',surfName:'Szuter',seed:57,len:4800,W:7.0,hAmp:34,hScale:650,dAmp:4,mtn:80,bumps:2.6,veg:'birch',dens:1.2,verge:-.4,grade:.12,

function Hterr(st,x,z){return st.hAmp*fbm(x/st.hScale,z/st.hScale,st.seed,4)+st.dAmp*fbm(x/90,z/90,st.seed+5,3)}
const pathCache={};
function genPath(st){
  if(pathCache[st.id])return pathCache[st.id];
  const STEP=34;
  for(let attempt=0;attempt<120;attempt++){

    const pts=[[0,0],[0,STEP]];let hd=0,seg=0,turn=0,fail=false;
    while(pts.length<n){
      if(seg<=0){const r=R();
        if(pts.length<5){turn=0;seg=1}
        else if(r<.24){turn=0;seg=2+(R()*4|0)}
        else if(r<.88){turn=(R()<.5?-1:1)*(.1+R()*R()*.6);seg=1+(R()*4|0)}
        else{turn=(R()<.5?-1:1)*(.95+R()*.25);seg=3}}
      seg--;

      for(const t of [turn,turn*.5,0,.35,-.35,.7,-.7]){
        const h=hd+t,q=[p[0]+Math.sin(h)*STEP,p[1]+Math.cos(h)*STEP];let ok=true;
        for(let k=0;k<pts.length-6;k++){const lim=(pts.length-1-k)<12?55:110;const dx=pts[k][0]-q[0],dz=pts[k][1]-q[1];if(dx*dx+dz*dz<lim*lim){ok=false;break}}
        if(ok){hd=h;pts.push(q);placed=true;if(t!==turn){turn=t;seg=Math.min(seg,1)}break}
      }
      if(!placed){fail=true;break}
    }
    if(!fail)return(pathCache[st.id]=pts);
  }
  const pts=[];for(let i=0;i<st.len/34;i++)pts.push([Math.sin(i*.3)*60,i*34]);return(pathCache[st.id]=pts);
}

  if(st.surface==='tarmac'){const rl=new Uint8Array(M),rr=new Uint8Array(M);
    for(let i=60;i<M-60;i++){const out=T.k[i]>0?-1:1;let want=T.R[i]<120;
      const ox=T.cx[i]+T.lx[i]*out*14,oz=T.cz[i]+T.lz[i]*out*14;if(Hterr(st,ox,oz)<T.hr[i]-3.5)want=true;

function crossH(T,i,o,x,z){

const NUMW=['','jeden','dwa','trzy','cztery','pięć','sześć'];
const DISTW={100:'sto',150:'sto pięćdziesiąt',200:'dwieście',250:'dwieście pięćdziesiąt',300:'trzysta',350:'trzysta pięćdziesiąt',400:'czterysta',450:'czterysta pięćdziesiąt',500:'pięćset'};
function buildNotes(T){
  const M=T.M,step=T.step;let raw=[];let i=0;
  while(i<M){if(T.R[i]<220){const dir=Math.sign(T.k[i]);let j=i,minR=T.R[i],minAt=i;
      while(j<M&&T.R[j]<260&&Math.sign(T.k[j])===dir){if(T.R[j]<minR){minR=T.R[j];minAt=j}j++}
      raw.push({type:'c',i0:i,i1:Math.min(j,M-1),dir:dir>0?'L':'P',minR,minAt});i=j+1}else i++}
  const merged=[];for(const n of raw){const p=merged[merged.length-1];if(p&&p.dir===n.dir&&(n.i0-p.i1)*step<20){p.i1=n.i1;if(n.minR<p.minR){p.minR=n.minR;p.minAt=n.minAt}}else merged.push(n)}
  const notes=[];
  for(const n of merged){n.ang=Math.abs(T.th[n.i1]-T.th[n.i0]);if(n.ang<.22&&n.minR>70)continue;
    n.sev=n.minR<28?1:n.minR<42?2:n.minR<60?3:n.minR<85?4:n.minR<125?5:6;
    if(n.ang>2.2&&n.minR<48)n.type='h';
    n.long=(n.i1-n.i0)*step>85&&n.ang>.9;
    n.tight=n.type==='c'&&(n.minAt-n.i0)/Math.max(1,n.i1-n.i0)>.62&&T.R[Math.min(M-1,n.i0+3)]>n.minR*1.6;
    notes.push(n)}
  for(const b of T.bumps){const sm=b.sig*step,curv=b.amp/(sm*sm);notes.push({type:curv>.02?'j':'g',i0:Math.round(b.i-b.sig*1.1),i1:Math.round(b.i+b.sig*.4),big:b.amp>2})}
  notes.sort((a,b)=>a.i0-b.i0);
  const out=notes.filter(n=>n.i0>T.iStart-10&&n.i0<T.iFinish);
  out.forEach(n=>{n.s=n.i0*step;n.e=n.i1*step});
  for(let k=0;k<out.length;k++){const n=out[k],nx=out[k+1];n.gap=nx?nx.s-n.e:(T.sFinish-n.e);n.into=!!nx&&n.gap<30}
  out.forEach(n=>{
    const dw=n.dir==='L'?'lewy':'prawy';
    if(n.type==='c'){n.say=dw+' '+NUMW[n.sev]+(n.long?' długi':'')+(n.tight?' zacieśnia':'');n.label=n.dir+n.sev;n.extra=n.long?'długi':n.tight?'zacieśnia':''}
    else if(n.type==='h'){n.say='uwaga, '+dw+' nawrót';n.label=n.dir+' nawrót';n.extra=''}
    else if(n.type==='j'){n.say=n.big?'duża hopa':'hopa';n.label='hopa';n.extra=''}
    else{n.say='garb';n.label='garb';n.extra=''}
    const r=Math.min(500,Math.round(n.gap/50)*50);
    n.link=n.into?' w ':(n.gap>=90&&DISTW[r]?', '+DISTW[r]:'');n.distLabel=n.into?'w':(n.gap>=90&&DISTW[r]?String(r):'')});
  const calls=[];for(let k=0;k<out.length;){const c={s:out[k].s,text:'',notes:[]};let n;do{n=out[k];c.notes.push(n);c.text+=n.say+n.link;k++}while(n.into&&k<out.length&&c.notes.length<3);c.text=c.text.replace(/ w $/,'');calls.push(c)}
  return{notes:out,calls};
}
function refTime(T,surf,grip){
  const mu=MU[surf][REC[surf].tyre]*grip,M=T.M,step=T.step,v=new Float32Array(M);
  for(let i=0;i<M;i++)v[i]=Math.min(52,Math.sqrt(mu*9.81*T.R[i]*1.15));
  v[T.iStart]=0;for(let i=T.iStart+1;i<M;i++){const a=Math.max(1,7.5*(1-v[i-1]/58))*Math.min(1,Math.sqrt(mu/.8));v[i]=Math.min(v[i],Math.sqrt(v[i-1]*v[i-1]+2*a*step))}
  for(let i=M-2;i>=0;i--)v[i]=Math.min(v[i],Math.sqrt(v[i+1]*v[i+1]+2*mu*9.81*.9*step));
  let t=0;for(let i=T.iStart;i<T.iFinish;i++)t+=step/Math.max(1,(v[i]+v[i+1])/2);return t;
}
function rivalTimes(T,stIdx,tod,w){
  const st=STAGES[stIdx];const grip=st.surface==='snow'?(w==='wet'?.97:1):WEATHER[w].grip;
  const base=refTime(T,st.surface,grip)*DIFF[OPT.difficulty]*(tod==='night'?1.03:1)*(w==='fog'?1.02:1);
  const R=rngf(st.seed*97+(tod.length*7)+w.length);
  return RIVALS.map((r,k)=>({name:r[0],cc:r[1],t:base*(1+RIVAL_OFF[k])*(1+(R()-.5)*.024)}));
}

function raceStep(dt){
  const T=TRK;
  if(state==='count'){race.cd-=dt;const c=Math.ceil(race.cd);$('#count').textContent=race.cd>0?(c>3?'':c):'START';
    if(!countVoice&&race.cd<1.4){countVoice=true;if(NOTES.calls[0]){const c0=NOTES.calls[0];c0.notes.forEach(n=>n._called=true);race.callIdx=1;say(c0.text)}}
    physicsFrame(dt,true);if(race.cd<=0){state='race';setTimeout(()=>{if(state!=='count')$('#count').textContent=''},700)}}
  else if(state==='race'||state==='finish'){
    if(state==='finish'){INP.thr=0;INP.brk=1;INP.hb=false;INP.steer*=.9}
    physicsFrame(dt,false);
    rplAcc+=dt;while(rplAcc>=1/30){recFrame();rplAcc-=1/30}
    if(state==='race'){race.t+=dt;race.top=Math.max(race.top,Math.abs(car.u));callNotes();

      if(!car.onRoad&&!car.air&&Math.abs(car.u)>3&&rumbleT<=0){rumble(160,0,clamp(Math.abs(car.u)/60,.08,.25));rumbleT=.15}
      if(car.limiter&&limT<=0){rumble(60,0,.12);limT=.25}
      while(race.nextSplit<2&&car.s>=T.sSplit[race.nextSplit]){const t=race.t+race.pen;race.splits.push(t);const ref=race.rivalRef?race.rivalRef[race.nextSplit]:null;

      const tdot=car.u*Math.cos(car.psi-Math.atan2(T.tx[car.k],T.tz[car.k]));
      if(tdot<-4){race.wrongT+=dt;if(race.wrongT>1&&flashT<=0)flash('Zły kierunek',true)}else race.wrongT=0;
      if(Math.abs(car.o)>45){race.offT+=dt;if(race.offT>2&&flashT<=0)flash('Wróć na trasę  [R]',true)}else race.offT=0;

    else{race.finishT+=dt;if(race.finishT>3.2&&state==='finish'){state='results';showResults()}}

}

function optRow(it,obj,onChange){const r=document.createElement('div');r.className='orow';r.tabIndex=0;r.setAttribute('data-nav','');

    else if(it.t==='tog')c=`<button class="tog" tabindex="-1" aria-pressed="${!!v}">${v?'Wł.':'Wył.'}</button>`;
    else if(it.t==='rng'){const disp=it.u==='%'?Math.round(v*100)+'%':it.u==='°'?v+'°':it.lo?'':(+v).toFixed(2);c=`<div class="rngw"><div class="rng"><input type="range" tabindex="-1" min="${it.min}" max="${it.max}" step="${it.step}" value="${v}" aria-label="${it.l}"><span class="v">${disp}</span></div>${it.lo?`<div class="ends"><span>${it.lo}</span><span>${it.hi}</span></div>`:''}</div>`}
    else if(it.t==='color')c=`<div class="swatches">${it.o.map(cl=>`<button class="sw" tabindex="-1" style="background:${cl}" data-c="${cl}" aria-label="Kolor ${cl}" aria-pressed="${cl===v}"></button>`).join('')}</div>`;
    r.innerHTML=lb+c;

  r.adjust=d=>{const v=obj[it.k];if(it.t==='sel'){const i=it.o.findIndex(o=>o[0]===v);set(it.o[(i+d+it.o.length)%it.o.length][0])}else if(it.t==='tog')set(!v);else if(it.t==='rng')set(+clamp(+v+d*it.step,it.min,it.max).toFixed(3));else if(it.t==='color'){const i=it.o.indexOf(v);set(it.o[(i+d+it.o.length)%it.o.length])}};

  r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d)r.adjust(+b.dataset.d);else if(b.classList.contains('tog'))r.adjust(1);else if(b.dataset.c)set(b.dataset.c)});

const fmtMin=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',')+' min';
function repairPart(k,maxPct){const d=CH.parts[k],cost=PART_COST[k];if(d<=0){SVC.msg=PART_NAME[k]+': bez uszkodzeń';return}
  const can=Math.min(d,maxPct==null?d:maxPct,SVC.t/cost);if(can<=.05){SVC.msg='Brak czasu na naprawę';return}
  CH.parts[k]=d-can<.05?0:d-can;SVC.t=Math.max(0,SVC.t-can*cost);
  SVC.msg=CH.parts[k]>0?PART_NAME[k]+': naprawa częściowa (zabrakło czasu)':PART_NAME[k]+': naprawione';

/* replay with TV cameras */
const RP={t:0,speed:1,paused:false,chase:false,cams:[],seqT:0,seqN:0,wasChase:null,info:''};
function buildTvCams(){const T=TRK,R=rngf(T.st.seed*17+3),cams=[];
  for(let s=T.sStart+40;s<T.L-10;s+=140){const i=Math.min(T.M-1,Math.round(s/T.step)),side=T.k[i]>0?-1:1,e=side>0?T.extL[i]:T.extR[i];
    const o=Math.max(T.W2+2.5,Math.min(T.W2+6+R()*3,e-.5)),x=T.cx[i]+T.lx[i]*o*side,z=T.cz[i]+T.lz[i]*o*side;
    cams.push({s:i*T.step,x,y:groundAt(x,z)+1.5+R()*2.5,z})}
  return cams}
function rpmFromU(u){const a=Math.abs(u);for(let g=0;g<6;g++){const r=a/CAR.R*CAR.gears[g]*D.final*60/(2*Math.PI);if(r<7000||g===5)return Math.max(CAR.idle,Math.min(r,CAR.limit))}return CAR.idle}
function replaySeekK(){const n=hashNearest(car.x,car.z,3);car.k=n.i>=0?n.i:0}
function startReplay(){if(rplN<2)return;Object.assign(RP,{t:0,speed:1,paused:false,chase:false,seqT:0,seqN:0,wasChase:null,info:''});RP.cams=buildTvCams();
  replayApply(0);replaySeekK();camShake=0;clearDust();showScreen(null);$('#rhud').hidden=false;state='replay';initAudio();lastT=performance.now()}
function endReplay(){state='results';$('#rhud').hidden=true;showScreen('sResults')}
function replayKey(code){const dur=(rplN-1)/30;
  if(code==='Escape'||code==='KeyP')endReplay();
  else if(code==='Space'){if(RP.paused&&RP.t>=dur){RP.t=0;RP.seqT=0;RP.seqN=0;replayApply(0);replaySeekK();clearDust();RP.paused=false}else RP.paused=!RP.paused}
  else if(code==='Digit1'||code==='Numpad1')RP.speed=.5;else if(code==='Digit2'||code==='Numpad2')RP.speed=1;else if(code==='Digit3'||code==='Numpad3')RP.speed=2;
  else if(code==='KeyC')RP.chase=!RP.chase}
function replayApply(t){const f=t*30,i=Math.max(0,Math.min(Math.floor(f),rplN-2)),a=clamp(f-i,0,1),o=i*RPL_F,p=o+RPL_F,L=k=>lerp(RPL[o+k],RPL[p+k],a);
  car.x=L(0);car.y=L(1);car.z=L(2);car.psi=L(3);car.gp=L(4);car.gr=L(5);car.pd=L(6);car.rd=L(7);car.steer=L(8);car.spinAng=L(9);car.u=L(10);car.brk=L(11);car.air=(a<.5?RPL[o+12]:RPL[p+12])>.5;
  car.v=0;car.r=0;car.slipR=0;car.spin=0;car.limiter=false;car.rpm=rpmFromU(car.u);
  const du=RPL[p+10]-RPL[o+10];car.thr=car.brk>.1?0:clamp(.35+du*4,0,1)}
function replayVisual(){CARV.root.position.set(car.x,car.y,car.z);CARV.root.rotation.y=car.psi;CARV.tilt.rotation.set(-car.gp,0,car.gr);CARV.body.rotation.set(car.pd,0,car.rd);CARV.body.position.y=D.ride;
  for(let i=0;i<4;i++){CARV.spins[i].rotation.x=car.spinAng;if(i<2)CARV.wheels[i].rotation.y=car.steer;CARV.wheels[i].position.y=.32+(car.air?-.08:0)}
  CARV.tail.emissiveIntensity=car.brk>.1?3:(TOD[CUR.tod].night?1:.4);updateDmgVisual()}
function tvCamera(){const c=RP.cams;let cam=c[c.length-1];for(const q of c)if(q.s>=car.s){cam=q;break}if(!cam)return;
  const d=Math.hypot(cam.x-car.x,cam.y-car.y,cam.z-car.z);camera.position.set(cam.x,cam.y,cam.z);camera.lookAt(car.x,car.y+.8,car.z);
  camera.fov=clamp(lerp(55,30,(d-8)/90),30,55);camera.updateProjectionMatrix()}
function replayStep(dt){const T=TRK,dur=(rplN-1)/30,sdt=RP.paused?0:dt*RP.speed;
  RP.t+=sdt;if(RP.t>=dur){RP.t=dur;RP.paused=true}
  replayApply(RP.t);
  if(Math.hypot(car.x-T.cx[car.k],car.z-T.cz[car.k])>30)replaySeekK();else car.k=nearestIdx(car.x,car.z,car.k,18);
  const q=probe(car.x,car.z,car.k);car.o=q.o;car.s=(q.i+q.f)*T.step;car.onRoad=Math.abs(q.o)<=T.W2+.25;
  replayVisual();if(sdt>0)emitDust(sdt);
  RP.seqT+=sdt;if(RP.seqT>4){RP.seqT=0;RP.seqN++}
  const chase=RP.chase||RP.seqN%3===2;
  if(sdt>0||chase!==RP.wasChase){if(chase){const cm=camMode;camMode=2;updateCamera(Math.max(sdt,1e-3),chase!==RP.wasChase);camMode=cm}else tvCamera()}
  RP.wasChase=chase;
  updateAudio(dt,!RP.paused);
  $('#rFill').style.width=(dur>0?RP.t/dur*100:0).toFixed(1)+'%';
  const info=`${fmt(RP.t)} / ${fmt(dur)} · ×${RP.speed===.5?'0,5':RP.speed} · ${chase?'za autem':'kamera TV'}${RP.paused?' · pauza':''}  —  1/2/3 prędkość · Spacja pauza · C kamera · Esc wyjście`;
  if(info!==RP.info){RP.info=info;$('#rInfo').textContent=info}}
screen('sChamp','<div class="side wide" id="champBody"></div>',()=>exitToMenu());
function showChampEnd(){const ov=CH.rivals.map(r=>({name:r.name,cc:r.cc,t:r.t})).concat([{name:'Ty',t:CH.player,me:true}]).sort((a,b)=>a.t-b.t);const pos=ov.findIndex(r=>r.me)+1;
  $('#champBody').innerHTML=`<div><div class="eyebrow">Mistrzostwa zakończone</div><h2>${pos===1?'Mistrz rajdu!':pos+'. miejsce w generalce'}</h2></div>
  <div class="stats">${CH.log.map(l=>`<div class="stat"><div class="k">${l.stage}</div><div class="v">${fmt(l.t)} <span class="cc">${l.pos}.</span></div></div>`).join('')}</div>
  <div><div class="lbl">Klasyfikacja końcowa</div>${resTable(ov)}</div><div class="row-btns"><button class="btn primary" data-nav data-c="menu">Menu główne</button></div>`;showScreen('sChamp')}
$('#champBody').addEventListener('click',e=>{if(e.target.closest('[data-c]'))exitToMenu()});

/* ====================== quality & resize ====================== */
function applyQuality(){renderer.setPixelRatio(QPR[OPT.quality]);const sh=OPT.shadows&&QSH[OPT.quality]>0;renderer.shadowMap.enabled=sh;sun.castShadow=sh;
  if(sh){sun.shadow.mapSize.set(QSH[OPT.quality],QSH[OPT.quality]);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true)});resize()}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dustMat.uniforms.uScale.value=h*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));resizePost()}
addEventListener('resize',resize);

/* ====================== post-processing setup ====================== */
function postReady(){
  return typeof THREE.EffectComposer!=='undefined'&&typeof THREE.RenderPass!=='undefined'&&typeof THREE.ShaderPass!=='undefined'&&typeof THREE.UnrealBloomPass!=='undefined'&&typeof THREE.FXAAShader!=='undefined'&&typeof THREE.CopyShader!=='undefined'&&typeof THREE.LuminosityHighPassShader!=='undefined';
}
function teardownPost(){
  if(composer){try{composer.renderTarget1.dispose();composer.renderTarget2.dispose()}catch(e){}}
  composer=null;bloomPass=null;gradePass=null;fxaaPass=null;
}
function setupPost(){
  teardownPost();
  if(OPT.post&&postReady()){
    renderer.toneMapping=THREE.NoToneMapping;
    const half=renderer.capabilities.isWebGL2;
    const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:half?THREE.HalfFloatType:THREE.UnsignedByteType});
    composer=new THREE.EffectComposer(renderer,rt);
    composer.addPass(new THREE.RenderPass(scene,camera));
    if(OPT.bloom&&OPT.quality!=='low'){
      const str=CUR.tod==='day'?.35:CUR.tod==='dusk'?.55:.9;
      bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),str,.5,.85);
      if(OPT.quality==='ultra'){const o=bloomPass.setSize.bind(bloomPass);bloomPass.setSize=function(w,h){o(w*2,h*2)}}
      composer.addPass(bloomPass);
    }
    gradePass=new THREE.ShaderPass(GradeShader);
    composer.addPass(gradePass);
    fxaaPass=new THREE.ShaderPass(THREE.FXAAShader);
    composer.addPass(fxaaPass);
    applyGradeTone();
  }else{
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
  }
  resizePost();
}
function resizePost(){
  if(!composer)return;
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth,innerHeight);
  if(fxaaPass){const pr=renderer.getPixelRatio();fxaaPass.uniforms.resolution.value.set(1/(innerWidth*pr),1/(innerHeight*pr));}
}
function applyGradeTone(){
  if(!gradePass)return;
  const td=TOD[CUR.tod];
  gradePass.uniforms.uExposure.value=td.exp;
  const L=gradePass.uniforms.uLift.value,G=gradePass.uniforms.uGain.value;
  if(CUR.tod==='day'){L.set(.015,.01,-.01);G.set(1.02,1.0,.97)}
  else if(CUR.tod==='dusk'){L.set(.04,.01,-.04);G.set(1.1,.95,.82)}
  else{L.set(-.01,0,.03);G.set(.88,.95,1.1)}
}
function updateFX(now){
  const t=now*.001;
  skyMat.uniforms.uTime.value=t;
  for(let i=0;i<windMats.length;i++){const u=windMats[i].userData.wind;if(u){u.uTime.value=t;u.uWind.value=windStrength;}}
  if(gradePass){const u=gradePass.uniforms;u.uTime.value=t;
    let rain=0;if(OPT.rainfx&&WEATHER[CUR.w].precip&&prMode==='rain')rain=camMode<2?1:.35;
    u.uRain.value=rain;
    let spd=0;if(OPT.speedblur&&state==='race')spd=clamp((Math.abs(car.u)-25)/25,0,1)*.6;
    u.uSpeed.value=spd;
  }
}

/* ====================== main loop ====================== */
function loop(now){requestAnimationFrame(loop);let dt=(now-lastT)/1000;lastT=now;dt=Math.min(dt,1/20);if(dt<=0)return;
  pollPadMenu();
  if(state==='count'||state==='race'||state==='finish'){readInput(dt);raceStep(dt);updateAudio(dt,true)}
  else if(state==='menu'||state==='results'||state==='boot'){
    menuAng+=dt*.12;car.rpm=lerp(car.rpm||CAR.idle,CAR.idle+Math.sin(now*.002)*40,.1);
    if(TRK){updateCarVisual(dt);const r=7.5;camera.position.set(car.x+Math.sin(menuAng+car.psi)*r,car.y+2.3+Math.sin(menuAng*.7)*.4,car.z+Math.cos(menuAng+car.psi)*r);camera.lookAt(car.x,car.y+.9,car.z);camera.fov=lerp(camera.fov,50,.05);camera.updateProjectionMatrix()}
    updateAudio(dt,false)}
  else if(state==='replay')replayStep(dt);
  else if(state==='pause')updateAudio(dt,false);
  if(state!=='pause')updateDust(state==='replay'?(RP.paused?0:dt*RP.speed):dt);updatePrecip(dt);
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  sun.target.position.set(car.x||0,car.y||0,car.z||0);sun.position.copy(sun.target.position).addScaledVector(sunDir,180);
  dustMat.uniforms.uScale.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  updateFX(now);
  if(composer)composer.render(dt);else renderer.render(scene,camera);
  if(OPT.fps){fpsAcc+=dt;fpsN++;if(fpsAcc>.5){$('#fps').textContent=Math.round(fpsN/fpsAcc)+' kl/s';fpsAcc=0;fpsN=0}}}

/* ====================== boot ====================== */
buildCar();applyQuality();
setTimeout(()=>{try{buildWorld(0,'day','dry');setupPost();resetCarAt(TRK.iStart-5);derive();updateCarVisual(0);state='menu';$('#loading').hidden=true;showScreen('sMain')}
  catch(err){console.error(err);$('#loading').innerHTML='<div>Błąd uruchomienia<small>'+String(err&&err.message||err)+'</small></div>'}
  requestAnimationFrame(loop)},30);
document.fonts&&document.fonts.ready.then(()=>{shownNotes=['x','x']});
})();
</script>
